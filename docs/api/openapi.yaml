openapi: 3.1.0
info:
  title: LoomTable Server API
  version: 0.1.0
  description: |
    LoomTable Server 的初版 REST API 合同。
    Server 是 Workspace、Base、Table、Field、View、Record 和 Managed Attachment 元数据的事实来源。
    JSON Endpoint 只接受 UTF-8 application/json；charset 只能省略或为 UTF-8，Content-Encoding 只接受 identity。
    原始请求体在解码前限制为 8 MiB，并拒绝重复 Object Key 或多个顶层 JSON 值。
  license:
    name: GPL-3.0
servers:
  - url: http://127.0.0.1:31201
    description: Personal 本地服务示例
  - url: '{serverUrl}'
    description: 用户配置的 LoomTable Server
    variables:
      serverUrl:
        default: http://127.0.0.1:31201
tags:
  - name: Meta
  - name: Workspaces
  - name: Bases
  - name: Tables
  - name: Fields
  - name: Views
  - name: Records
  - name: Changes
  - name: Attachments
security:
  - bearerAuth: []
paths:
  /healthz:
    get:
      tags: [Meta]
      operationId: healthz
      security: []
      responses:
        '200':
          description: Server process is alive
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: ok
        default:
          $ref: '#/components/responses/ErrorResponse'

  /readyz:
    get:
      tags: [Meta]
      operationId: readyz
      security: []
      responses:
        '200':
          description: Server is ready to accept business requests
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: ok
        '503':
          description: Server is alive but not ready; pending migrations return MIGRATION_REQUIRED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /v1/meta:
    get:
      tags: [Meta]
      operationId: getServerMeta
      security: []
      responses:
        '200':
          description: Server capability and compatibility information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerMeta'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /v1/workspaces:
    get:
      tags: [Workspaces]
      operationId: listWorkspaces
      responses:
        '200':
          description: Complete, unpaginated Workspace list visible to the authenticated actor, ordered by createdAt ASC then id ASC. P0 enforces a hard limit of 100 Workspaces per Actor.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Workspace'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/ErrorResponse'
    post:
      tags: [Workspaces]
      operationId: createWorkspace
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkspaceRequest'
      responses:
        '201':
          description: Workspace created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/IdempotencyKeyReused'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /v1/workspaces/{workspaceId}:
    parameters:
      - $ref: '#/components/parameters/WorkspacePathId'
    get:
      tags: [Workspaces]
      operationId: getWorkspace
      description: Returns an active Workspace. Workspace deletion is not part of P0.
      responses:
        '200':
          description: Workspace metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/ErrorResponse'
    patch:
      tags: [Workspaces]
      operationId: updateWorkspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateNameRequest'
      responses:
        '200':
          description: Workspace renamed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/RevisionConflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /v1/bases:
    get:
      tags: [Bases]
      operationId: listBases
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: Complete, unpaginated Base list in a Workspace, ordered by createdAt ASC then id ASC. P0 enforces a hard limit of 500 Bases per Workspace.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Base'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/ErrorResponse'
    post:
      tags: [Bases]
      operationId: createBase
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBaseRequest'
      responses:
        '201':
          description: Base created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Base'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/IdempotencyKeyReused'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /v1/bases/{baseId}:
    parameters:
      - $ref: '#/components/parameters/BasePathId'
    get:
      tags: [Bases]
      operationId: getBase
      description: Returns an active Base whose Workspace ancestor is accessible. Base deletion is not part of P0.
      responses:
        '200':
          description: Base metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Base'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/ErrorResponse'
    patch:
      tags: [Bases]
      operationId: updateBase
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateNameRequest'
      responses:
        '200':
          description: Base renamed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Base'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/RevisionConflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /v1/tables:
    get:
      tags: [Tables]
      operationId: listTables
      parameters:
        - $ref: '#/components/parameters/BaseId'
        - $ref: '#/components/parameters/Lifecycle'
      responses:
        '200':
          description: Complete, unpaginated Table list in a Base, ordered by createdAt ASC then id ASC. P0 enforces a hard limit of 500 Tables per Base.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Table'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/ErrorResponse'
    post:
      tags: [Tables]
      operationId: createTable
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTableRequest'
      responses:
        '201':
          description: Table, Primary Field, and initial Grid View created atomically
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateTableResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/IdempotencyKeyReused'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /v1/tables/{tableId}:
    parameters:
      - $ref: '#/components/parameters/TableId'
    get:
      tags: [Tables]
      operationId: getTable
      description: Returns the directly addressed Table even when it is in Recycle State, including deletedAt, provided its Base and Workspace ancestors remain accessible. A hidden ancestor returns 404.
      responses:
        '200':
          description: Table metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Table'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/ErrorResponse'
    patch:
      tags: [Tables]
      operationId: updateTable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateNameRequest'
      responses:
        '200':
          description: Table updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Table'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/RevisionConflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/ErrorResponse'
    delete:
      tags: [Tables]
      operationId: deleteTable
      parameters:
        - $ref: '#/components/parameters/ExpectedRevision'
      responses:
        '204':
          description: Table moved to the recycle state
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/RevisionConflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /v1/tables/{tableId}/restore:
    parameters:
      - $ref: '#/components/parameters/TableId'
    post:
      tags: [Tables]
      operationId: restoreTable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestoreMetadataRequest'
      responses:
        '200':
          description: Table restored when its expected revision matches
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Table'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/RevisionConflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /v1/tables/{tableId}/fields:
    parameters:
      - $ref: '#/components/parameters/TableId'
    get:
      tags: [Fields]
      operationId: listFields
      parameters:
        - $ref: '#/components/parameters/Lifecycle'
      responses:
        '200':
          description: Complete, unpaginated Field list in a Table, ordered by position ASC then id ASC. P0 enforces a hard limit of 500 Fields per Table.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Field'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/ErrorResponse'
    post:
      tags: [Fields]
      operationId: createField
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFieldRequest'
      responses:
        '201':
          description: Field created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Field'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/IdempotencyKeyReused'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /v1/fields/{fieldId}:
    parameters:
      - $ref: '#/components/parameters/FieldId'
    patch:
      tags: [Fields]
      operationId: updateField
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFieldRequest'
      responses:
        '200':
          description: Field updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Field'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/RevisionConflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/ErrorResponse'
    delete:
      tags: [Fields]
      operationId: deleteField
      parameters:
        - $ref: '#/componen…18323 tokens truncated…        type: string
        cursor:
          type: string
          description: Opaque next-page cursor bound to the cluster token and limit.
        limit:
          type: integer
          minimum: 1
          maximum: 500
          default: 100

    QueryRequest:
      type: object
      additionalProperties: false
      description: When viewId is supplied, the View configuration is the base query. Explicit filter, sort, projection, and pagination values temporarily override it for this request and are not persisted. The JSON body is limited to 8 MiB. Any unavailable query-semantic Field reference returns 422; stale presentation-only references are ignored.
      properties:
        viewId: { $ref: '#/components/schemas/ViewId' }
        lifecycle:
          $ref: '#/components/schemas/LifecycleScope'
        cursor:
          type: string
          description: >-
            Versioned Base64URL keyset cursor valid for 30 minutes and authenticated with
            a purpose-separated HMAC-SHA256 key persisted in PostgreSQL. It binds the Actor,
            route, equivalent query, API version, View revision, referenced Field revisions,
            Query Schema Fingerprint, position, and issue/expiry time. Record data changes do
            not directly invalidate it; query-semantic schema changes return 410, while malformed,
            signature-invalid, or query-mismatched cursors return 400. It is not a membership
            snapshot, so concurrent writes may affect later pages.
        limit:
          type: integer
          minimum: 1
          maximum: 500
          default: 100
        projection:
          type: array
          maxItems: 500
          uniqueItems: true
          items: { $ref: '#/components/schemas/FieldId' }
        filter:
          $ref: '#/components/schemas/FilterNode'
        sort:
          type: array
          maxItems: 10
          uniqueItems: true
          x-unique-by: fieldId
          description: Temporary request override with at most 10 distinct Field IDs. If absent, the server uses createdAt ASC, id ASC. With explicit Sort, the server appends Record ID ASC as the stable final tie-breaker. Text/LongText/URL sort by the normalized text key, Number numerically, Date chronologically, and Checkbox false before true. Select first applies the requested null bucket, then always places active Options before deleted Options; asc/desc only reverses order inside each active/deleted bucket. MultiSelect and Location are unsortable in P0 and return 422 UNSUPPORTED_SORT. Unset and null share the requested null bucket; natural empty values remain real sortable values.
          items:
            $ref: '#/components/schemas/SortSpec'
        search:
          type: string
          maxLength: 500
          description: Contains search over the Primary Field, Text, LongText, and URL fields only. The Server trims outer Unicode whitespace; an empty normalized value means no Search. Comparison uses NFC plus locale-neutral Unicode Default Case Folding and remains accent-sensitive.

    FilterNode:
      oneOf:
        - $ref: '#/components/schemas/FilterGroup'
        - $ref: '#/components/schemas/FilterRule'

    FilterGroup:
      type: object
      additionalProperties: false
      description: Recursive AND/OR groups. Each group must contain at least one child; a complete Filter is limited to depth 8 and 100 total group-plus-rule nodes. Violations return 422 VALIDATION_ERROR.
      x-max-depth: 8
      x-max-total-nodes: 100
      required: [kind, operator, children]
      properties:
        kind:
          const: group
        operator:
          type: string
          enum: [and, or]
        children:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/FilterNode'

    FilterRule:
      type: object
      additionalProperties: false
      description: Operator and value are validated against the referenced Field Type. Text, LongText, and URL support equality, inequality, contains, not-contains, prefix, suffix, empty, and not-empty. Number and Date support equality, inequality, all six ordered comparisons, empty, and not-empty. Checkbox supports equality and inequality; Select supports equality, inequality, empty, and not-empty; MultiSelect supports includes, excludes, empty, and not-empty; Location supports empty and not-empty. isEmpty matches Unset, explicit null, and the Field Type's natural empty value; isNotEmpty is its complement. Text operands are preserved without implicit trim and compared after NFC plus locale-neutral Unicode Default Case Folding; matching remains accent-sensitive.
      required: [kind, fieldId, operator]
      properties:
        kind:
          const: rule
        fieldId: { $ref: '#/components/schemas/FieldId' }
        operator:
          type: string
          enum: [is, isNot, isEmpty, isNotEmpty, contains, notContains, startsWith, endsWith, greaterThan, greaterOrEqual, lessThan, lessOrEqual, includes, excludes]
        value:
          description: Field-type-specific value. Unsupported operators return 422 UNSUPPORTED_OPERATOR.

    SortSpec:
      type: object
      additionalProperties: false
      required: [fieldId, direction]
      properties:
        fieldId: { $ref: '#/components/schemas/FieldId' }
        direction:
          type: string
          enum: [asc, desc]
        nulls:
          type: string
          enum: [first, last]
          default: last

    QueryResult:
      type: object
      additionalProperties: false
      description: Each page is produced in one short read-only Repeatable Read transaction. items, changeCursor, and the first-page totalCount therefore describe the same database snapshot; no transaction survives across HTTP requests.
      required: [items, hasMore, changeCursor]
      allOf:
        - if:
            required: [hasMore]
            properties:
              hasMore: { const: true }
          then:
            required: [nextCursor]
        - if:
            required: [hasMore]
            properties:
              hasMore: { const: false }
          then:
            not:
              required: [nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Record'
        nextCursor:
          type: string
          description: Authenticated opaque cursor for the next page, bound to this equivalent query and its query-semantic schema revisions.
        hasMore:
          type: boolean
        changeCursor:
          type: string
          description: Table Change Cursor read from the same transaction snapshot as items.
        totalCount:
          type: integer
          format: int64
          minimum: 0
          description: Exact number of Records matching the equivalent query, read in the same transaction as items and changeCursor. Returned only on the first page, when no cursor was supplied.

    MutationRequest:
      type: object
      additionalProperties: false
      description: All commands are applied atomically in one transaction. If any command fails, the whole request rolls back. Reusing clientMutationId returns the first result without applying the mutation again. A request cannot contain more than one command targeting the same existing Record; violations return 422. The JSON body is limited to 8 MiB.
      required: [clientMutationId, commands]
      properties:
        clientMutationId:
          $ref: '#/components/schemas/MutationId'
          description: Unique with actorId. Reusing it with the same request body returns the historical result; a different body returns 409 IDEMPOTENCY_KEY_REUSED. P0 retains results for 30 days.
        commands:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: '#/components/schemas/MutationCommand'

    MutationCommand:
      oneOf:
        - $ref: '#/components/schemas/CreateRecordCommand'
        - $ref: '#/components/schemas/UpdateRecordCommand'
        - $ref: '#/components/schemas/DeleteRecordCommand'
        - $ref: '#/components/schemas/RestoreRecordCommand'

    CreateRecordCommand:
      type: object
      additionalProperties: false
      required: [kind, values]
      properties:
        kind: { const: createRecord }
        values:
          allOf:
            - $ref: '#/components/schemas/RecordValues'
          description: May be an empty object; a Primary Field value is not required. Explicit null or natural empty values are distinct from omitted, Unset Fields.

    UpdateRecordCommand:
      type: object
      additionalProperties: false
      description: Writes fields in set and removes keys in unsetFieldIds. A Field present in both is invalid; omitted Fields are unchanged. expectedRevision is checked first; an identical normalized result returns status unchanged without a Revision or Change.
      required: [kind, recordId, expectedRevision]
      anyOf:
        - required: [set]
        - required: [unsetFieldIds]
      properties:
        kind: { const: updateRecord }
        recordId: { $ref: '#/components/schemas/RecordId' }
        expectedRevision:
          type: integer
          minimum: 1
        set:
          allOf:
            - $ref: '#/components/schemas/RecordValues'
          minProperties: 1
          description: Values keyed by Field ID. Explicit null, empty string, or empty array is a write when valid for the Field Type.
        unsetFieldIds:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: '#/components/schemas/FieldId' }
          description: Field IDs whose keys are removed from Record.values.

    DeleteRecordCommand:
      type: object
      additionalProperties: false
      description: expectedRevision is checked first. Deleting an already deleted Record with its current revision is an invalid state transition and returns 422.
      required: [kind, recordId, expectedRevision]
      properties:
        kind: { const: deleteRecord }
        recordId: { $ref: '#/components/schemas/RecordId' }
        expectedRevision:
          type: integer
          minimum: 1

    RestoreRecordCommand:
      type: object
      additionalProperties: false
      description: expectedRevision is checked first. Restoring an active Record with its current revision is an invalid state transition and returns 422.
      required: [kind, recordId, expectedRevision]
      properties:
        kind: { const: restoreRecord }
        recordId: { $ref: '#/components/schemas/RecordId' }
        expectedRevision:
          type: integer
          minimum: 1

    MutationResult:
      type: object
      additionalProperties: false
      description: The request is atomic. Any rejected or conflicting command rolls back every command in the request.
      required: [clientMutationId, results, changeCursor]
      properties:
        clientMutationId: { $ref: '#/components/schemas/MutationId' }
        results:
          type: array
          items:
            $ref: '#/components/schemas/CommandResult'
        changeCursor:
          type: string
          description: Current Table Change Cursor after the transaction. It remains at the existing position when every command is unchanged.

    CommandResult:
      type: object
      additionalProperties: false
      required: [index, status, record]
      properties:
        index:
          type: integer
          minimum: 0
        status:
          type: string
          enum: [applied, unchanged]
          description: unchanged means the expected revision matched but normalized state was already identical; no Revision or Change was produced.
        record:
          $ref: '#/components/schemas/Record'

    ConflictResponse:
      type: object
      additionalProperties: false
      description: Revision conflict using the standard error envelope.
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/ConflictErrorBody'

    ConflictErrorBody:
      allOf:
        - $ref: '#/components/schemas/ErrorBody'
        - type: object
          required: [clientMutationId, failedCommandIndex, conflicts]
          properties:
            code:
              const: CONFLICT
            clientMutationId:
              $ref: '#/components/schemas/MutationId'
            failedCommandIndex:
              type: integer
              minimum: 0
            conflicts:
              type: array
              items:
                $ref: '#/components/schemas/ConflictBody'

    ConflictBody:
      type: object
      required: [recordId, expectedRevision, currentRevision, currentValues]
      properties:
        recordId: { $ref: '#/components/schemas/RecordId' }
        expectedRevision:
          type: integer
        currentRevision:
          type: integer
        currentValues:
          $ref: '#/components/schemas/RecordValues'
        submittedSet:
          $ref: '#/components/schemas/RecordValues'
        submittedUnsetFieldIds:
          type: array
          uniqueItems: true
          items: { $ref: '#/components/schemas/FieldId' }

    ChangePage:
      type: object
      required: [items, nextCursor, hasMore]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Change'
        nextCursor:
          type: string
          description: Table-scoped opaque Change Cursor. The current default retention is 30 days; without a cursor the server returns the current tail and an empty page.
        hasMore: { type: boolean }

    Change:
      type: object
      required: [id, kind, tableId, revision, occurredAt]
      properties:
        id: { $ref: '#/components/schemas/ChangeId' }
        kind:
          type: string
          enum: [recordCreated, recordUpdated, recordDeleted, recordRestored, schemaChanged, viewChanged]
        tableId: { $ref: '#/components/schemas/TableId' }
        recordId: { $ref: '#/components/schemas/RecordId' }
        objectId:
          description: Field, View, Table, or other schema object ID for non-Record changes.
          oneOf:
            - $ref: '#/components/schemas/TableId'
            - $ref: '#/components/schemas/FieldId'
            - $ref: '#/components/schemas/ViewId'
        revision: { type: integer }
        actorId: { $ref: '#/components/schemas/ActorId' }
        occurredAt: { type: string, format: date-time }

    InitializeAttachmentRequest:
      type: object
      additionalProperties: false
      description: Managed attachments start as pending and require a subsequent binary PUT; Vault attachments are ready immediately and require a relative vaultPath. The Idempotency-Key header is required by the operation.
      required: [source, filename]
      properties:
        source:
          type: string
          enum: [managed, vault]
        filename: { type: string }
        mimeType: { type: string }
        size:
          type: integer
          minimum: 0
        vaultPath:
          type: string
          description: Required for vault attachments; must be a relative Vault path without dot, parent, or empty path members.

    ErrorResponse:
      type: object
      description: Standard error envelope. HTTP status mapping is 400 BAD_REQUEST or INVALID_CURSOR, 401 UNAUTHENTICATED, 403 FORBIDDEN, 404 NOT_FOUND, 409 CONFLICT or IDEMPOTENCY_KEY_REUSED, 410 CURSOR_EXPIRED or QUERY_SNAPSHOT_EXPIRED, 413 PAYLOAD_TOO_LARGE, 415 UNSUPPORTED_MEDIA_TYPE, 422 VALIDATION_ERROR, RESOURCE_LIMIT_EXCEEDED, INVALID_STATE_TRANSITION, UNSUPPORTED_SORT, UNSUPPORTED_OPERATOR, or VIEW_CONFIGURATION_REQUIRED, 501 CAPABILITY_NOT_ENABLED, 503 readiness/dependency failure, and 500 INTERNAL_ERROR. Cursor errors never expose decoded token contents.
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'

    ErrorBody:
      type: object
      description: Error details are safe for user display and diagnostics; requestId must be retained by clients.
      required: [code, message, requestId]
      properties:
        code: { type: string }
        message: { type: string }
        requestId: { $ref: '#/components/schemas/RequestId' }
        details:
          description: Code-specific safe details. Omitted when the error code has no defined detail payload.
          oneOf:
            - $ref: '#/components/schemas/ValidationErrorDetails'
            - $ref: '#/components/schemas/ResourceLimitExceededDetails'
            - $ref: '#/components/schemas/InvalidStateTransitionDetails'
            - $ref: '#/components/schemas/UnsupportedSortDetails'
            - $ref: '#/components/schemas/UnsupportedOperatorDetails'
            - $ref: '#/components/schemas/ViewConfigurationRequiredDetails'
            - $ref: '#/components/schemas/PayloadTooLargeDetails'

    ValidationErrorDetails:
      type: object
      additionalProperties: false
      required: [issues]
      properties:
        issues:
          type: array
          description: Stable validation issues sorted by JSON Pointer path, then code.
          items:
            $ref: '#/components/schemas/ValidationIssue'

    ValidationIssue:
      type: object
      additionalProperties: false
      required: [path, code]
      properties:
        path:
          type: string
          description: RFC 6901 JSON Pointer; the empty string identifies the request root.
        code:
          type: string
          enum: [required, type, format, unknownProperty, duplicate, limit, invalidReference]
        message:
          type: string

    ResourceReference:
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          type: string
          enum: [actor, workspace, base, table, field, view, record, selectOption, accessToken]
        id:
          type: string
          minLength: 1

    ResourceLimitExceededDetails:
      type: object
      additionalProperties: false
      required: [resource, parent, limit]
      properties:
        resource:
          type: string
          enum: [workspace, base, table, field, view, record, selectOption, accessToken, filterNode, sort, projection, mutationCommand]
        parent:
          $ref: '#/components/schemas/ResourceReference'
        limit:
          type: integer
          minimum: 0

    InvalidStateTransitionDetails:
      type: object
      additionalProperties: false
      required: [resource, action, current]
      properties:
        resource:
          $ref: '#/components/schemas/ResourceReference'
        action:
          type: string
          enum: [update, delete, restore, revoke]
        current:
          type: string
          enum: [active, deleted, revoked]

    UnsupportedSortDetails:
      type: object
      additionalProperties: false
      required: [fieldId]
      properties:
        fieldId:
          $ref: '#/components/schemas/FieldId'

    UnsupportedOperatorDetails:
      type: object
      additionalProperties: false
      required: [fieldId, operator]
      properties:
        fieldId:
          $ref: '#/components/schemas/FieldId'
        operator:
          type: string

    ViewConfigurationRequiredDetails:
      type: object
      additionalProperties: false
      required: [viewId, brokenFieldIds]
      properties:
        viewId:
          $ref: '#/components/schemas/ViewId'
        brokenFieldIds:
          type: array
          uniqueItems: true
          description: Invalid query-semantic Field IDs sorted lexicographically by stable ID.
          items:
            $ref: '#/components/schemas/FieldId'

    PayloadTooLargeDetails:
      type: object
      additionalProperties: false
      required: [limitBytes]
      properties:
        limitBytes:
          type: integer
          const: 8388608

